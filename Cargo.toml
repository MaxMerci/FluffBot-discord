[package]
name = "fluffbot-discord"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.0"
serenity = { version = "0.12", features = ["client", "gateway", "rustls_backend", "model", "cache", "framework", "standard_framework"] }
reqwest = { version = "0.12.28", features = ["json", "gzip", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
dotenvy = "0.15.7"
async-trait = "0.1.89"
once_cell = "1"
tiny-skia = "0.12.0"
cosmic-text = "0.18.2"
image = "0.25.9"
